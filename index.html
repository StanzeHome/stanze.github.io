<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
    }

    /* Background Image */
    .bg-image {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('./image.jpg') no-repeat center center/cover;
      filter: brightness(0.4);
    }

    /* Center Card Image */
    .center-image {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 950px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .center-image img {
      width: 100%;
      display: block;
    }

    /* Overlay Content */
    .content {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      width: 90%;
      max-width: 800px;
    }

    .content h1 {
      font-size: 48px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .content p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .content a {
      color: #fff;
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .center-image {
        width: 90%;
        top: 20%;
      }

      .content h1 {
        font-size: 50px;
      }

      .content p {
        font-size: 16px;
      }
	  .content {
		bottom: 16%;
	  }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Background -->
    <div class="bg-image"></div>


	<div class="wrap-image-text">
    <!-- Center Image -->
    <div class="center-image">
      <img src="./image.jpg" alt="Interior">
    </div>

    <!-- Text Content -->
    <div class="content">
      <h1>Coming Soon</h1>

      <p>
        We are currently relocating our showroom and constructing a new website.
      </p>

      <p>
        Rest assured, we continue to supply luxury brands and design services during this transition.
      </p>

      <p>
        For enquiries, please contact us at 
        <a href="mailto:info@stanze.co.uk">info@stanze.co.uk</a>.
      </p>
    </div>
	</div>

  </div>

</body>
</html>
